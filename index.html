<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>I love you</title>
    <style>
      body {
        margin: 0;
        background: white;
        color: red;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 1.25rem;
        gap: 1rem;
      }

      .message {
        margin: 0;
        font-size: 1.5rem;
      }

      .drawing {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      img {
        display: block;
        width: min(100%, 900px);
        height: auto;
        max-height: 60vh;
        object-fit: contain;
      }

      @media (max-width: 600px) {
        main {
          padding: 1rem;
          gap: 0.75rem;
        }

        .message {
          font-size: 1.1rem;
          line-height: 1.3;
        }

        img {
          max-height: 55vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="message">
        I value your existence more than my own, you’re the architect of my
        joy, the sculptor of my dearest memories, I love you
      </p>
      <div class="drawing">
        <img
          src="https://github.com/user-attachments/assets/46510371-7554-4806-9294-df67d087bcce"
          alt="The drawing from the README"
        />
      </div>
      <p class="message">Give me your skin, I’ll make a jacket bcs chica I wanna be you</p>
    </main>
  </body>
</html>
